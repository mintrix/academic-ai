<div class="container animated fadeInUp">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0 rounded-lg mt-5">
        <div class="card-header">
          <h3 class="text-center font-weight-light my-4">📚 Sistema de Acompanhamento Acadêmico</h3>
        </div>
        <div class="card-body">
          <form (ngSubmit)="submitData()" #form="ngForm">
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="form-floating mb-3 mb-md-0">
                  <input class="form-control" id="name" type="text" [(ngModel)]="name" name="name" placeholder="Seu nome" />
                  <label for="name">Nome</label>
                </div>
              </div>
              <div class="col-md-3">
                 <div class="form-floating mb-3 mb-md-0">
                <input class="form-control" id="notas" type="number" [(ngModel)]="gradeInput" name="gradeInput">
                <label for="notas">Notas</label>
                </div>
              </div>

              <div class="col-md-3">
                <div class="form-floating mb-3 mb-md-0">
                <button class="login100-form-btn mt-2" type="button" (click)="addGrade()">Adicionar Nota</button>
                <p class="mt-2">Notas: {{ grades.join(', ') }}</p>
                </div>
              </div>
            </div>

            <div class="form-floating mb-3">
              <input id="goals" type="text" [(ngModel)]="goals" name="goals" class="form-control" placeholder="Indique suas metas" />
              <label for="goals">Metas:</label>
            </div>

            <div class="form-floating mb-3">
              <textarea class="form-control" id="feedback" rows="5" [(ngModel)]="feedback" name="feedback" placeholder="Feedback do aluno"></textarea>
              <label for="feedback">Feedback:</label>
            </div>

            <div class="mt-4 mb-0 d-grid">
              <button class="login100-form-btn" type="submit" [disabled]="loading">
                {{ loading ? 'Enviando...' : 'Enviar para Análise' }}
              </button>
            </div>
          </form>

          <p class="mt-3 text-success">{{ message }}</p>
          <div *ngIf="analysisResult" class="mt-4 p-4 border rounded  shadow-sm">
          <h5 class="mb-3  fw-semibold">
            📊 Resultado da Análise:
            </h5>
            <pre class="m-0  bg-white p-3 rounded border">
            {{ analysisResult }}
            </pre>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
