<video autoplay muted loop class="bg-video">
  <source src="./assets/video/backgroud.mp4" type="video/mp4">
  Seu navegador não suporta vídeo em background.
</video>
<div  class="limiter animated fadeInRight " id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-5">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header ">
                                        <h3 class="text-center font-weight-light my-4">Academic-ai</h3>
                                        <img src="assets/images/ia.gif" alt="IA" class="img-fluid mb-3 d-block mx-auto" style="width: 100px;">
                                    </div>
                                    <div class="card-body">
                                        <form (ngSubmit)="onSubmit( f )" 
                                                #f="ngForm">
                                            <span *ngIf=" f.submitted && f.controls['email'].errors"
                                            class="text-danger animated fadeIn">O campo email é obrigatorio</span>
                                            <h5 class="text-center font-weight-light my-4">Cadastrar</h5>
                                            <div class="form-floating mb-3">
                                                <input class="form-control"  id="inputEmail"
                                                type="email" 
                                                name="email" 
                                                [(ngModel)]="usuario.email"
                                                 required
                                                 email
                                                placeholder="Email">
                                                <span class="focus-input100"></span>
                                                <label for="inputEmail">Email</label>
                                            </div>
                                            
                                           <span *ngIf=" f.submitted && f.controls['nome'].errors"
                                            class="text-danger animated fadeIn">O campo nome é obrigatorio</span>
                                            <div class="form-floating mb-3">
                                                <input class="form-control"  id="inputEmail"
                                                type="text" 
                                                name="nome"
                                                minlength="6"
                                                required
                                                [(ngModel)]="usuario.nome"
                                                placeholder="Nome e apelidos">
                                                <span class="focus-input100"></span>
                                                <label for="inputEmail">nome e apelido</label>
                                            </div>

                                            <span *ngIf=" f.submitted && f.controls['password'].errors"
                                            class="text-danger animated fadeIn">O campo password é obrigatorio minimo 6 caracteres</span>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="inputPassword"
                                                type="password" 
                                                name="password" 
                                                minlength="6"
                                                required 
                                                [(ngModel)]="usuario.password"
                                                placeholder="Password">
                                                <span class="focus-input100"></span>
                                                <label for="inputPassword">Password</label>
                                            </div>
                                            <div class="form-check mb-3">
                                                <input [(ngModel)]="lembrar" class="form-check-input"  type="checkbox" id="inputRememberPassword" />
                                                <label class="form-check-label" for="inputRememberPassword">Recordar meu usuario</label>
                                            </div>
        
                                            <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                                <a class="small" href=""></a>
                                                <button class="login100-form-btn" type="submit">CADASTRAR</button>
                                            </div>
                                        </form>
                                    </div>
                                    <div class="card-footer text-center py-3">
                                        <div class="small"><a routerLink="/login"> Ja tem cadastro? / entrar</a></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
</div>
